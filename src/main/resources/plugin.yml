name: TeleportPlugin
version: 1.0
main: com.example.teleport.TeleportPlugin
api-version: 1.20 # 自分が使ってるバージョンに合わせてね (例: 1.19, 1.21 など)
commands:
  sethome:
    description: ホームポイントを設定するよ
  home:
    description: ホームポイントにテレポートするよ
  delhome:
    description: ホームポイントを削除するよ
  rtp:
    description: ランダムテレポートのGUIを開くよ
  tpa:
    description: 相手のところへテレポートする申請を送るよ
  tp:
    description: 相手のところへテレポートする申請を送るよ
  teleport:
    description: 相手のところへテレポートする申請を送るよ
  tpahere:
    description: 相手を自分のところへ呼ぶ申請を送るよ
  teleporthere:
    description: 相手を自分のところへ呼ぶ申請を送るよ
  tpaccept:
    description: テレポート申請を受け入れるよ
  tpdeny:
    description: テレポート申請を拒否するよ
  tpadeny:
    description: テレポート申請を拒否するよ
  tpacancel:
    description: 送ったテレポート申請をキャンセルするよ
  tpauto:
    description: テレポート申請の自動受け入れをON/OFFするよ
