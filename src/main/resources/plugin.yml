name: TeleportPlugin
version: 1.0
main: com.example.teleport.TeleportPlugin
api-version: '26'
commands:
  sethome:
    description: ホーム登録
    usage: /sethome [名前]
  home:
    description: ホームテレポート
    usage: /home [名前]
  delhome:
    description: ホーム削除
    usage: /delhome [名前]
  rtp:
    description: ランダムテレポート
    usage: /rtp
  tpa:
    description: TP申請
    usage: /tpa <プレイヤー名>
  tp:
    description: TP申請
    usage: /tp <プレイヤー名>
  teleport:
    description: TP申請
    usage: /teleport <プレイヤー名>
  tpahere:
    description: プレイヤーを呼ぶ申請
    usage: /tpahere <プレイヤー名>
  teleporthere:
    description: プレイヤーを呼ぶ申請
    usage: /teleporthere <プレイヤー名>
  tpaccept:
    description: 申請を承認
    usage: /tpaccept
  tpdeny:
    description: 申請を拒否
    usage: /tpdeny
  tpadeny:
    description: 申請を拒否
    usage: /tpadeny
  tpacancel:
    description: 申請キャンセル
    usage: /tpacancel
  tpauto:
    description: 自動受け入れ切り替え
    usage: /tpauto
